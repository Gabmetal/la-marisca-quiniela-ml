name: Deploy Serverless App & Nightly Draw Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Runs Monday to Saturday at 00:45 UTC (21:45 ART, 45 min after 21:00 ART Nocturno draw)
    - cron: '45 0 * * 1-6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Nightly Draws & Update State JSON
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt
          python -c "from src.database import QuinielaDatabase; db = QuinielaDatabase(); added = db.sync_from_web(days_back=3); print(f'Added: {added}')" || true
          python src/export_static_state.py || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/state.json || true
          git diff --staged --quiet || git commit -m "chore(data): auto-sync nightly Nocturno draw and update state"
          git push || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Serverless Artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
