name: CI - K3s Deployment & Model Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify Engine & Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CLI Prediction & Engine Smoke Test
        run: |
          python src/app.py --cli --tickets 5

      - name: Validate Kubernetes Manifests
        run: |
          python -c "
          import os, glob
          manifests = glob.glob('k8s/*.yaml')
          assert len(manifests) >= 5, f'Missing manifests: {manifests}'
          print(f'Verified {len(manifests)} Kubernetes manifests successfully.')
          "
